name: Deye Pulse APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signing-sha: ${{ steps.signing.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure personal signing path
        run: echo "PULSE_KEYSTORE_PATH=$RUNNER_TEMP/pulse-signing/personal.jks" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: signing-cache
        with:
          path: ${{ runner.temp }}/pulse-signing/personal.jks
          key: deye-pulse-personal-signing-explicit-v2
      - name: Prepare persistent signing key
        run: |
          mkdir -p "$(dirname "$PULSE_KEYSTORE_PATH")"
          if [ ! -s "$PULSE_KEYSTORE_PATH" ]; then
            keytool -genkeypair -keystore "$PULSE_KEYSTORE_PATH" -storetype JKS -storepass android -keypass android -alias pulse -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Deye Pulse Personal"
          fi
      - name: Prevent accidental signing key changes
        run: |
          CERT_SHA=$(keytool -exportcert -alias pulse -keystore "$PULSE_KEYSTORE_PATH" -storepass android | sha256sum | cut -d ' ' -f1)
          test "$CERT_SHA" = "c0b402aded8f7299f92d90beb2f714b21175a107cca0c76b0174034cc53edce0" || { echo "Original signing key is unavailable. Refusing to publish an incompatible APK."; exit 1; }
      - name: Signing key identity
        id: signing
        run: echo "sha=$(sha256sum "$PULSE_KEYSTORE_PATH" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Test, lint and build
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - name: Name APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Deye-Pulse-2-install.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Deye-Pulse-2-install
          path: app/build/outputs/apk/debug/Deye-Pulse-2-install.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  device-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure personal signing path
        run: echo "PULSE_KEYSTORE_PATH=$RUNNER_TEMP/pulse-signing/personal.jks" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: signing-cache
        with:
          path: ${{ runner.temp }}/pulse-signing/personal.jks
          key: deye-pulse-personal-signing-explicit-v2
      - name: Verify signing key was preserved
        env:
          EXPECTED_SIGNING_SHA: ${{ needs.build.outputs.signing-sha }}
        run: |
          test -s "$PULSE_KEYSTORE_PATH"
          ACTUAL_SIGNING_SHA=$(sha256sum "$PULSE_KEYSTORE_PATH" | cut -d ' ' -f1)
          test "$ACTUAL_SIGNING_SHA" = "$EXPECTED_SIGNING_SHA"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -G 16M
            gradle connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.powerhub.pulse.next/com.powerhub.pulse.MainActivity
            sleep 2
            adb shell pidof com.powerhub.pulse.next
            mkdir -p ui-validation
            adb logcat -d -s PULSE_UI:I -v raw > ui-validation/pulse-ui.log
            python3 scripts/decode_ui_images.py ui-validation/pulse-ui.log ui-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-validation
          path: |
            app/build/reports/androidTests/
            ui-validation/
